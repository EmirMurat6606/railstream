# Note that I used a Freenove ESP32-S3-Mini-1, which is quite similar to the uno r4
[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 11500
lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4
